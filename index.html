    <style>

            --primary-purple: #38003c;
            --accent-yellow: #ffc107;
            --bg-main: #f4f6f9;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: #111;
            margin: 0; padding: 15px;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh;
        }
        .calculator-container {
            background: white;
            width: 100%;
            max-width: 950px;
            padding: 20px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 1px solid #ddd;
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-purple);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .header-section img {
            height: 50px;
            width: auto;
            object-fit: contain;
        }
        .header-title-area {
            text-align: center;
        }
        .header-title-area h2 {
            color: var(--primary-purple);
            margin: 0 0 3px 0;
            font-size: 17px;
        }
        .header-title-area span {
            font-size: 11px;
            color: #555;
            font-weight: bold;
        }
        .selector-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 10px 15px;
            border: 1px solid var(--primary-purple);
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .selector-section label {
            font-weight: bold;
            color: var(--primary-purple);
            font-size: 13px;
        }
        .selector-section select {
            width: 65%;
            padding: 8px;
            font-weight: bold;
            font-size: 13px;
            border: 1px solid var(--primary-purple);
            border-radius: 4px;
            outline: none;
            background: #fafafa;
        }
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--primary-purple);
        }
        th, td {
            border: 1px solid var(--primary-purple);
            padding: 7px 10px;
            text-align: center;
            font-size: 11.5px;
        }
        th {

        td.text-right {

        input.score-input {

    function renderEvaluationForm() {
        const selectType = document.getElementById('evalFormSelect').value;
        const template = formTemplates[selectType] || formTemplates['teacher'];
        const tbody = document.getElementById('evalTableBody');
        tbody.innerHTML = '';

        template.items.forEach((item, index) => {
            tbody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td class="text-right">${item.name}</td>
                    <td>${item.weight}%</td>
                    <td>5</td>
                    <td><input type="number" step="any" min="0" max="5" value="5" class="score-input" data-weight="${item.weight}" onfocus="onScoreFocus(this)" onblur="onScoreBlur(this)" oninput="calculateScores()"></td>
                </tr>
            `;
        });
        calculateScores();
    }

    let lastFocusedScoreValue = "";
    function onScoreFocus(input) {
        lastFocusedScoreValue = input.value;
        input.value = "";
    }

    function onScoreBlur(input) {
        if(input.value.trim() === "") {
            input.value = lastFocusedScoreValue !== "" ? lastFocusedScoreValue : "5";
            calculateScores();
        }
    }

    function calculateScores() {
        let totalWeightedScore = 0;
        let totalMaxScore = 0;
        const inputs = document.querySelectorAll('.score-input');

        inputs.forEach(input => {
            let val = parseFloat(input.value);
            if (isNaN(val)) val = 0;
            if (val > 5) { val = 5; input.value = 5; }
            if (val < 0) { val = 0; input.value = 0; }

            let weight = parseFloat(input.getAttribute('data-weight')) || 0;
            let weightedScore = (val / 5) * weight;
            totalWeightedScore += weightedScore;
            totalMaxScore += 5;
        });

        document.getElementById('actualMaxSum').textContent = totalMaxScore;
        let finalAcquiredScore = (totalWeightedScore / 100) * totalMaxScore;
        document.getElementById('actualSum').textContent = Number(finalAcquiredScore.toFixed(1));
        document.getElementById('finalPercentage').textContent = Number(totalWeightedScore.toFixed(1)) + '%';
    }

    window.onload = function() {
        renderEvaluationForm();
    };
</script>
